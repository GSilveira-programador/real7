services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
      POSTGRES_DB: elite_boots
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - elite-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite_boots"]
      interval: 5s
      retries: 10
volumes:
  elite-data:
